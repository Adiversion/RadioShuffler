name: Build & Release App

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.8)'
        required: true
        default: 'v1.0.8'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Dynamic Version
        run: |
          RAW_VER="${{ github.event.inputs.version_tag }}"
          CLEAN_VER="${RAW_VER#v}"
          echo "Building version: $CLEAN_VER"

          gradle assembleDebug --no-daemon \
            -PcustomVersionName="$CLEAN_VER" \
            -PcustomVersionCode="${{ github.run_number }}"

      - name: Rename APK for Release
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/debug/*.apk release_output/RadioShuffler.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag }}
          name: Radio Shuffler ${{ github.event.inputs.version_tag }}
          draft: false
          prerelease: false
          files: release_output/RadioShuffler.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
