name: Build & Release App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional manual version tag, e.g. v1.1.0. Leave empty for automatic version.'
        required: false
        default: ''
      version_bump:
        description: 'Automatic bump type used when version_tag is empty'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare release keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_ENCRYPTION_PASSWORD: ${{ secrets.KEYSTORE_ENCRYPTION_PASSWORD }}
        run: |
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "::error::Secret RELEASE_STORE_PASSWORD is not set in repository secrets."
            exit 1
          fi
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Secret RELEASE_KEY_PASSWORD is not set in repository secrets."
            exit 1
          fi
          if [ -z "$KEYSTORE_ENCRYPTION_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_ENCRYPTION_PASSWORD is not set in repository secrets."
            exit 1
          fi

          if [ ! -f keystore/radioshuffler-release.keystore.enc ]; then
            echo "Encrypted release keystore not found in repository. Generating initial release keystore..."
            mkdir -p keystore

            keytool -genkeypair \
              -v \
              -keystore "$RUNNER_TEMP/radioshuffler-release.keystore" \
              -alias radioshuffler \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$RELEASE_STORE_PASSWORD" \
              -keypass "$RELEASE_STORE_PASSWORD" \
              -dname "CN=RadioShuffler, OU=Dev, O=RadioShuffler, L=Unknown, S=Unknown, C=US"

            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
              -in "$RUNNER_TEMP/radioshuffler-release.keystore" \
              -out keystore/radioshuffler-release.keystore.enc \
              -pass env:KEYSTORE_ENCRYPTION_PASSWORD

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/radioshuffler-release.keystore.enc
            git commit -m "Add encrypted release keystore [skip ci]"
            git push
            echo "Initial encrypted keystore committed and pushed to repository."
          else
            echo "Decrypting existing release keystore..."
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
              -in keystore/radioshuffler-release.keystore.enc \
              -out "$RUNNER_TEMP/radioshuffler-release.keystore" \
              -pass env:KEYSTORE_ENCRYPTION_PASSWORD
          fi

          test -f "$RUNNER_TEMP/radioshuffler-release.keystore"

      - name: Resolve version
        id: version
        shell: python
        env:
          MANUAL_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          VERSION_BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          import os
          import re
          import subprocess

          manual = os.environ.get("MANUAL_VERSION_TAG", "").strip()
          bump = os.environ.get("VERSION_BUMP", "patch").strip() or "patch"

          def normalize(tag):
              tag = tag.strip()
              if not tag:
                  return ""
              normalized = tag if tag.startswith("v") else f"v{tag}"
              if not re.fullmatch(r"v\d+\.\d+\.\d+", normalized):
                  raise SystemExit("Manual version_tag must look like v1.2.3 or 1.2.3")
              return normalized

          subprocess.run(["git", "fetch", "--tags", "--force"], check=False)
          tags = subprocess.check_output(
              ["git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*"],
              text=True,
          ).splitlines()

          parsed = []
          for tag in tags:
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag.strip())
              if match:
                  parsed.append(tuple(map(int, match.groups())))

          major, minor, patch = max(parsed) if parsed else (1, 0, 0)
          previous_tag = f"v{major}.{minor}.{patch}" if parsed else ""

          if manual:
              version_tag = normalize(manual)
          else:
              if bump == "major":
                  major, minor, patch = major + 1, 0, 0
              elif bump == "minor":
                  minor, patch = minor + 1, 0
              else:
                  patch += 1

              version_tag = f"v{major}.{minor}.{patch}"

          version_name = version_tag[1:] if version_tag.startswith("v") else version_tag
          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a") as f:
                  f.write(f"version_tag={version_tag}\n")
                  f.write(f"version_name={version_name}\n")
                  f.write(f"previous_tag={previous_tag}\n")
          print(f"version_tag={version_tag}")
          print(f"version_name={version_name}")
          print(f"previous_tag={previous_tag}")

      - name: Show resolved version
        run: |
          echo "Resolved version: ${{ steps.version.outputs.version_tag }}"
          echo "Previous version: ${{ steps.version.outputs.previous_tag }}"

      - name: Build Release APK with Dynamic Version
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "Building version: ${{ steps.version.outputs.version_name }}"

          gradle assembleRelease --no-daemon \
            -PcustomVersionName="${{ steps.version.outputs.version_name }}" \
            -PcustomVersionCode="${{ github.run_number }}" \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/radioshuffler-release.keystore" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="radioshuffler" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_STORE_PASSWORD"

      - name: Rename APK for Release
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/*.apk release_output/RadioShuffler.apk

      - name: Report APK size
        run: ls -lh release_output/RadioShuffler.apk

      - name: Generate Dynamic Release Notes
        shell: python
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          import os
          import subprocess

          prev_tag = os.environ.get("PREVIOUS_TAG", "").strip()
          version_tag = os.environ.get("VERSION_TAG", "").strip()
          version_name = os.environ.get("VERSION_NAME", "").strip()
          run_number = os.environ.get("RUN_NUMBER", "").strip()

          commit_lines = []
          try:
              if prev_tag:
                  cmd = ["git", "log", f"{prev_tag}..HEAD", "--pretty=format:- %s ([%h](https://github.com/Adiversion/radioshuffler/commit/%H))", "--no-merges"]
              else:
                  cmd = ["git", "log", "-n", "10", "--pretty=format:- %s ([%h](https://github.com/Adiversion/radioshuffler/commit/%H))", "--no-merges"]
              output = subprocess.check_output(cmd, text=True).strip()
              if output:
                  commit_lines = [line.strip() for line in output.splitlines() if line.strip()]
          except Exception as e:
              print(f"Commit log extraction warning: {e}")

          if not commit_lines:
              commit_lines = ["- Stability, playback, and performance improvements."]

          changelog_section = "\n".join(commit_lines)

          compare_section = ""
          if prev_tag and prev_tag != version_tag:
              compare_section = f"\n**Full Changelog**: https://github.com/Adiversion/radioshuffler/compare/{prev_tag}...{version_tag}\n"

          notes = (
              f"## 📻 Radio Shuffler {version_tag}\n\n"
              f"### 📦 Release Metadata\n"
              f"- **Version Name:** `{version_name}`\n"
              f"- **Build Code:** `{run_number}`\n"
              f"- **Target OS:** Android 8.0+ (API 26 – API 35)\n"
              f"- **License:** GNU General Public License v3.0 (GPL-3.0)\n\n"
              f"---\n\n"
              f"### 📝 What's Changed in this Release\n"
              f"{changelog_section}\n\n"
              f"{compare_section}"
              f"---\n\n"
              f"### 📲 Installation & Updates\n"
              f"- **Direct Install:** Download `RadioShuffler.apk` below and install it on your Android device.\n"
              f"- **Built-in In-App Updates:** Open Settings (`☰`) in the top right of the app anytime to check for releases, monitor live download progress, and update with one tap.\n"
              f"- **Obtainium (Optional):** If you manage your FOSS apps with [Obtainium](https://github.com/ImranR98/Obtainium), add `https://github.com/Adiversion/radioshuffler` to track releases.\n"
          )
          os.makedirs("release_output", exist_ok=True)
          with open("release_output/release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          print("=== Generated Release Notes ===")
          print(notes)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: Radio Shuffler ${{ steps.version.outputs.version_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_output/release_notes.md
          files: release_output/RadioShuffler.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
