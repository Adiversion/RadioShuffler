name: Generate Encrypted Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEYSTORE_ENCRYPTION_PASSWORD: ${{ secrets.KEYSTORE_ENCRYPTION_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validate required secrets
        run: |
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$KEYSTORE_ENCRYPTION_PASSWORD"

      - name: Stop if encrypted keystore already exists
        run: |
          if [ -f keystore/radioshuffler-release.keystore.enc ]; then
            echo "Encrypted release keystore already exists. Do not generate a new one or app updates will conflict."
            exit 1
          fi

      - name: Generate and encrypt release keystore
        run: |
          mkdir -p keystore

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/radioshuffler-release.keystore" \
            -alias radioshuffler \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -keypass "$RELEASE_STORE_PASSWORD" \
            -dname "CN=RadioShuffler, OU=Dev, O=RadioShuffler, L=Unknown, S=Unknown, C=US"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 100000 \
            -in "$RUNNER_TEMP/radioshuffler-release.keystore" \
            -out keystore/radioshuffler-release.keystore.enc \
            -pass env:KEYSTORE_ENCRYPTION_PASSWORD

          rm -f "$RUNNER_TEMP/radioshuffler-release.keystore"

      - name: Commit encrypted keystore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keystore/radioshuffler-release.keystore.enc
          git commit -m "Add encrypted release keystore"
          git push
